{% extends 'base_public.html' %}

{% block title %}Password Reset Complete - {{ site_settings.school_name|default:"Belings Driving School" }}{% endblock %}

{% block content %}
<section class="py-5 bg-light" style="min-height: 75vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center p-4 p-md-5">
                    <div class="mb-3">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-3">Password Updated!</h3>
                    <p class="text-muted mb-4">Your password has been set. You may go ahead and log in now.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-bold">Sign In Now</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
