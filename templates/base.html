{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard - Belings Driving School System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
  <!-- System Admin / Internal Dashboard Header -->
  <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-2 shadow">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white fw-bold" href="/admin/">
      <i class="bi bi-speedometer2 me-2"></i> Belings Driving School Admin
    </a>
    <div class="navbar-nav flex-row ms-auto me-3 gap-2">
      <a class="nav-link px-3 text-white" href="{% url 'website:home' %}"><i class="bi bi-globe me-1"></i> Public Website</a>
      <a class="nav-link px-3 text-white" href="/admin/logout/"><i class="bi bi-box-arrow-right me-1"></i> Sign out</a>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row">
      <main class="col-12 px-md-4 py-4">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
